name: Build and publish image

# Builds the Dockerfile on GitHub's runners and pushes the result to GHCR.
# Two reasons this exists rather than a host building from source:
#   - it proves the image builds at all, independently of any hosting platform
#   - the published image can be deployed by a host that has no access to this
#     repo, which sidesteps the GitHub-App connection dance entirely
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Backstop: without this a hung step runs to GitHub's 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects uppercase paths, and GitHub usernames may contain them.
      - name: Normalise image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}

      - name: Smoke-test the built image
        timeout-minutes: 3
        # Waits for the server's own startup line rather than curling the mount
        # path: a GET there opens a long-lived SSE stream, so curl would block
        # until the job timed out instead of returning a status code.
        run: |
          docker run -d --name turo -p 8080:8080 \
            -e MCP_PATH=smoketest ${{ steps.name.outputs.image }}:${{ github.sha }}

          for _ in $(seq 1 60); do
            if docker logs turo 2>&1 | grep -q "Application startup complete"; then
              echo "server came up"
              docker logs turo
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=turo)" ]; then
              echo "container exited before startup:"
              docker logs turo
              exit 1
            fi
            sleep 1
          done

          echo "timed out waiting for startup:"
          docker logs turo
          exit 1
